name: 3 - Tests

# Run manually from the Actions tab ("Run workflow" button)
on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Say hello
        run: echo "Hello Olivia"
      - name: Set up JDK 21 for x64
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
        
      - name: Maven Test
        run: mvn -B test
      - name: Build Command
        run: docker build -t cicd-training-2026 .